services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Loc4lDevOnly!nwh"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ./data/raw:/data/raw:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Loc4lDevOnly!nwh' -C -Q 'SELECT 1' -l 3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
